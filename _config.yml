title: KappaArmy
description: Dein Destiny 2 Clan seit Day-1 – Community, Raids und Dungeons
url: "https://kappaarmy.github.io"
baseurl: "/KappaArmy"
markdown: kramdown
permalink: pretty
collections:
  raids:
    output: true
    permalink: /raids/:name/
  dungeons:
    output: true
    permalink: /dungeons/:name/
defaults:
  - scope:
      path: ""
      type: raids
    values:
      layout: guide
      category: Raid
  - scope:
      path: ""
      type: dungeons
    values:
      layout: guide
      category: Dungeon
