title: KappaArmy
description: Dein Destiny 2 Clan seit Day-1 – Community, Raids und Dungeons
url: "https://kappaarmy.github.io"
baseurl: "/"
markdown: kramdown
permalink: pretty
logo: /assets/images/logo/KappaArmy_256.webp
collections:
  raids:
    output: true
    permalink: /raids/:name/
  dungeons:
    output: true
    permalink: /dungeons/:name/
defaults:
  - scope:
      path: ""
      type: raids
    values:
      layout: guide
      category: Raid
  - scope:
      path: ""
      type: dungeons
    values:
      layout: guide
      category: Dungeon
